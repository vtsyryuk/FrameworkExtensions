name: SonarCloud Analysis

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sonarcloud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SONAR_ENABLED: ${{ vars.SONAR_ENABLED }}
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'vtsyryuk' }}
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'vtsyryuk_FrameworkExtensions' }}

jobs:
  verify:
    name: SonarCloud build and tests
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      - name: Set up NuGet
        uses: NuGet/setup-nuget@d105a947828025cd7a980103c35ba2bfae586d0f # v2
      - name: Build, run NUnit tests, and collect OpenCover coverage
        shell: pwsh
        run: |
          ./.github/scripts/sonar-dotnet.ps1
      - name: Upload scanner inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sonar-inputs
          path: |
            build/coverage.xml
            build/test-results.xml
          if-no-files-found: error
          retention-days: 1
      - name: Report analysis activation state
        shell: bash
        run: |
          if [ "$SONAR_ENABLED" != 'true' ]; then
            echo '### SonarCloud analysis is not activated' >> "$GITHUB_STEP_SUMMARY"
            echo 'Build/test verification ran. No SonarCloud analysis or quality gate ran. Complete .github/SONARCLOUD.md and set SONAR_ENABLED=true.' >> "$GITHUB_STEP_SUMMARY"
          fi

  analysis:
    name: SonarCloud analysis and quality gate
    permissions:
      contents: read
      pull-requests: read
    needs: verify
    # Untrusted PRs still get build/test verification, without receiving a token.
    if: vars.SONAR_ENABLED == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require analysis credentials
        shell: bash
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::SonarCloud is enabled but SONAR_TOKEN is missing. Add the repository secret; see .github/SONARCLOUD.md.'
            exit 1
          fi
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      - name: Set up NuGet
        uses: NuGet/setup-nuget@d105a947828025cd7a980103c35ba2bfae586d0f # v2
      - name: Download scanner inputs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: sonar-inputs
          path: build
      - name: Analyze .NET and enforce the quality gate
        shell: pwsh
        run: |
          ./.github/scripts/sonar-dotnet.ps1 -Analyze
